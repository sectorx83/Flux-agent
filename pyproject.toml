[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "flux-agent"
version = "0.1.0"
description = "A local-first AI agent for chat, planning, development, and automation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Flux Agent Contributors" }]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.9,<15.0",
  "httpx>=0.27,<1.0",
  "platformdirs>=4.2,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]
browser = ["playwright>=1.50,<2.0"]
remote = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[project.scripts]
flux = "flux_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flux_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
